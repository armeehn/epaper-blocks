name: validate

on:
  push:
  pull_request:

jobs:
  blocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet cryptography pytest

      # The command CONTRIBUTING.md tells contributors to run before opening a
      # PR. Kept as its own step so a descriptor error is the first thing red.
      - name: Validate every block descriptor
        run: python3 tools/validate_blocks.py

      # Everything a device checks that a descriptor review cannot: that each
      # published .epb is the reviewed block.json, that its signature verifies
      # against keys/epaper-blocks.pub.pem, that it carries the keyid stock
      # firmware looks it up by, that index.json is current and fits the
      # portal's 24 KB fetch cap, and that no private key was committed.
      #
      # This replaces three hand-rolled shell steps, one of which verified
      # against keys/demo-registry.pub.pem -- a file that is not in this
      # repository, so the signature check crashed instead of checking.
      - name: Registry seam tests
        run: pytest -q
